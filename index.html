<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSense — Intelligent Inventory Management &amp; Stock Ledger ERP</title>
  <meta name="description" content="Precision Slate ERP inventory monitoring, multi-facility warehouse bin architecture, double-entry immutable stock ledger, and AI-powered predictive demand forecasting.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg">

  <!-- Google Fonts: Plus Jakarta Sans & Inter & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Precision Slate ERP Design Palette (Stitch Source of Truth)
            primary: '#0058be',
            'primary-hover': '#00479e',
            'primary-container': '#dbe1ff',
            'on-primary': '#ffffff',
            'on-primary-container': '#00174b',
            
            // Neutral Surfaces
            'surface-bg': '#F8FAFC',
            'surface-card': '#FFFFFF',
            'surface-subtle': '#F1F5F9',
            'surface-container': '#F1F5F9',
            'surface-container-low': '#F8FAFC',
            'surface-container-high': '#E2E8F0',
            'surface-bright': '#FFFFFF',
            
            // Borders & Outlines
            'border-subtle': '#E2E8F0',
            'border-strong': '#CBD5E1',
            outline: '#94A3B8',
            'outline-variant': '#CBD5E1',
            
            // Text & Content Hierarchy
            'on-surface': '#0F172A',
            'on-surface-variant': '#475569',
            tertiary: '#64748B',
            'inverse-surface': '#0F172A',

            // Semantic Status Colors
            'status-success': '#10B981',
            'status-success-bg': '#ECFDF5',
            'status-warning': '#F59E0B',
            'status-warning-bg': '#FFFBEB',
            'status-danger': '#EF4444',
            'status-danger-bg': '#FEF2F2',
            'status-error': '#EF4444',
            'status-error-bg': '#FEF2F2',
            'status-info': '#3B82F6',
            'status-info-bg': '#EFF6FF',

            // Accents
            'secondary-fixed': '#E0E7FF',
            secondary: '#4338CA'
          },
          spacing: {
            'space-xs': '0.25rem',   // 4px
            'space-sm': '0.5rem',    // 8px
            'space-md': '1rem',      // 16px
            'space-lg': '1.5rem',    // 24px
            'space-xl': '2rem'       // 32px
          },
          fontFamily: {
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
            headline: ['"Plus Jakarta Sans"', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            'tabular-data': ['Inter', 'monospace']
          },
          fontSize: {
            'headline-lg': ['1.5rem', { lineHeight: '2rem', fontWeight: '700' }],
            'headline-sm': ['1.125rem', { lineHeight: '1.5rem', fontWeight: '600' }],
            'body-lg': ['1rem', { lineHeight: '1.5rem' }],
            'body-md': ['0.875rem', { lineHeight: '1.25rem' }],
            'body-sm': ['0.75rem', { lineHeight: '1rem' }],
            'label-lg': ['0.875rem', { lineHeight: '1.25rem', fontWeight: '500' }],
            'label-md': ['0.75rem', { lineHeight: '1rem', fontWeight: '500' }],
            'label-sm': ['0.6875rem', { lineHeight: '0.875rem', fontWeight: '500' }]
          },
          boxShadow: {
            'xs': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
            'card': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05)'
          }
        }
      }
    };
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./css/custom.css">
</head>
<body class="bg-surface-bg text-on-surface antialiased selection:bg-primary/20 selection:text-primary">

  <!-- Root SPA Mounting Point -->
  <div id="app"></div>

  <!-- Main ES Module Script -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
